<h2>Connexion</h2>

<div>

  <label>Email</label>

  <input
    type="email"
    [value]="email()"
    (input)="email.set($any($event.target).value)"
  >

</div>

<br>

<div>

  <label>Mot de passe</label>

  <input
    type="password"
    [value]="password()"
    (input)="password.set($any($event.target).value)"
  >

</div>

<br>

<button (click)="login()">
  Se connecter
</button>

<input 
    type="search"
    placeholder="Rechercher un titre ou un artiste..."
    [value]="searchTerm()"
    (input)="searchTerm.set($any($event.target).value)"
>

<section class="grid">
    @for (track of filteredTracks(); track track.id){
        <app-track-card
        [track]="track"
        (favoriteToggled)="toggleFavorite($event)">
        </app-track-card>
    } @empty{
        <p>Aucune morceau à afficher</p>
    }
</section>

<article 
    class="card"
    [appHighlightFavorite]="track().favorite"
    [class.active]="active()"
    (click)="select.emit(track())"
>
    <img [src]="track().coverUrl" [alt]="track().title">

    <h3> {{ track().title }} </h3>
    <p> {{ track().artist }} </p>

    <p> {{ track().durationSeconds | durationFormat }} </p>

    @switch (true){
        @case (track().rating >= 9){
            <span class="badge gold">⭐ Coup de cœur</span>
        }

        @case (track().rating >= 7){
            <span class="badge blue">👍 Recommandé</span>
        }

        @default {
            <span class="badge muted">à découvrir</span>
        }
    }

    @if (active()){
        <span class="badge">▶️ En lecture</span>
    }
    <button (click)="toggleFavorite($event)">
        {{ track().favorite ? '❤️' : '🤍' }}
    </button>
</article>
